[package]
name = "mem-inspector-desktop"
version = "0.3.0"
edition = "2021"

[features]
# Tauri CLI enables this for packaged builds. Direct Cargo releases need it too.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
mem-core = { path = "../crates/mem-core" }
mem-ai = { path = "../crates/mem-ai" }
portable-pty = "0.9"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
